name: Release

on:
  push:
    tags: ["*"]
  # Build the selected existing tag from Actions > Release > Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example, 0.1.12)"
        required: true
        default: "0.1.12"
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Check tag and manifest version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "const fs=require('fs'); const version=JSON.parse(fs.readFileSync('manifest.json')).version; if (version !== process.env.TAG) { throw new Error('Git tag must exactly match manifest.json version'); }"
      - run: npm run check
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/styles.css
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
