name: Check preview fixes
on:
  push:
    branches: [investigate/native-drawing-embeds]
    paths:
      - '.github/workflows/preview-update.yml'
      - 'scripts/apply-preview-update.mjs'
      - 'src/drawing-preview*.ts'
      - 'src/preview-limits.ts'
      - 'src/drawing-embeds.ts'
      - 'scripts/test-preview-*.mjs'
permissions:
  contents: write
concurrency:
  group: preview-fix-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply checked source edits
        run: node scripts/apply-preview-update.mjs
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Save checked source
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.ts esbuild.config.mjs scripts/audit-release.mjs scripts/test-file-isolation.mjs scripts/test-font-loading.mjs scripts/test-theme.mjs scripts/test-drawing-embeds.mjs manifest.json package.json package-lock.json versions.json src/styles.css CHANGELOG.md
          git commit -m 'Integrate and check preview fixes for 0.1.13'
          git push origin HEAD:refs/heads/investigate/native-drawing-embeds
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pack test files
        run: |
          mkdir -p test-build/just-simple-excalidraw
          cp dist/main.js dist/manifest.json dist/styles.css test-build/just-simple-excalidraw/
          cp RELEASE_NOTES.md test-build/
          echo '${{ steps.source.outputs.sha }}' > test-build/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v6
        with:
          name: just-simple-excalidraw-0.1.13-test
          path: test-build/
          retention-days: 7
      - name: Publish test release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 0.1.13
          target_commitish: ${{ steps.source.outputs.sha }}
          name: 0.1.13 - Preview fixes
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
