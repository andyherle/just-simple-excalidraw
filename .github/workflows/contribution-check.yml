name: Contribution check
on:
  push:
    branches: [qa/upstream-contribution]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b69bd9635fc38b7ed66cf697c992fcaf082ded51
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
      - name: Verify checked source
        run: test "$(git rev-parse HEAD^{tree})" = bc1836f16c0be755cdad224aee1e000fbe4a4755
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v6
        with:
          name: checked-upstream-preview-build
          retention-days: 7
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
